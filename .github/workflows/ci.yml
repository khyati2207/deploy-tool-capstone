name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deploy tool
        run: python -m pip install -e .

      - name: Check deploy tool
        run: deploy-tool --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sample-react-app/package-lock.json

      - name: Install app packages
        working-directory: sample-react-app
        run: npm ci

      - name: Build React app
        working-directory: sample-react-app
        run: npm run build
