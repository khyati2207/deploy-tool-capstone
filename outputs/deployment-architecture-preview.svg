<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect width="1600" height="1100" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#14233b}.title{font-size:30px;font-weight:bold}.sub{font-size:16px;fill:#52647d}.lane{font-size:13px;font-weight:bold;fill:#52647d;letter-spacing:1px}.head{font-size:17px;font-weight:bold}.body{font-size:15px;fill:#26364c}.card{stroke-width:2;rx:16}.arrow{stroke:#566b82;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#566b82"/></marker></defs><text class="title" x="45" y="60">From React code to live website</text><text class="sub" x="47" y="95">A simple deployment journey: your CLI prepares the app, AWS serves it, and you manage each release.</text><text class="lane" x="45" y="160">YOUR PROJECT</text><text class="lane" x="45" y="435">BUILD + AWS</text><rect class="card" x="45" y="180" width="340" height="205" fill="#EAF2FF" stroke="#4B76C7"/><text class="head" x="63" y="218">1  START</text><text class="body" x="63" y="263"><tspan x="63">Developer runs</tspan><tspan x="63" dy="30">deploy-tool deploy</tspan><tspan x="63" dy="30">From the React project</tspan></text><rect class="card" x="430" y="180" width="340" height="205" fill="#F0EDFF" stroke="#8066C2"/><text class="head" x="448" y="218">2  CHECK</text><text class="body" x="448" y="263"><tspan x="448">CLI detects</tspan><tspan x="448" dy="30">CRA or Vite</tspan><tspan x="448" dy="30">Reads build settings</tspan></text><rect class="card" x="815" y="180" width="340" height="205" fill="#FFF5E4" stroke="#D6952F"/><text class="head" x="833" y="218">3  INSTALL</text><text class="body" x="833" y="263"><tspan x="833">npm or yarn installs</tspan><tspan x="833" dy="30">project packages</tspan><tspan x="833" dy="30">Uses lockfile</tspan></text><rect class="card" x="1200" y="180" width="340" height="205" fill="#FFF8E8" stroke="#D6AD56"/><text class="head" x="1218" y="218">4  BUILD</text><text class="body" x="1218" y="263"><tspan x="1218">Docker runs</tspan><tspan x="1218" dy="30">production build</tspan><tspan x="1218" dy="30">Reuses build cache</tspan></text><rect class="card" x="1200" y="455" width="340" height="205" fill="#EAF7EF" stroke="#359269"/><text class="head" x="1218" y="493">5  PROVISION</text><text class="body" x="1218" y="538"><tspan x="1218">Terraform prepares</tspan><tspan x="1218" dy="30">an S3 bucket</tspan><tspan x="1218" dy="30">Sets hosting + versioning</tspan></text><rect class="card" x="815" y="455" width="340" height="205" fill="#E8F4FB" stroke="#3984B8"/><text class="head" x="833" y="493">6  PUBLISH</text><text class="body" x="833" y="538"><tspan x="833">Python CLI + boto3</tspan><tspan x="833" dy="30">uploads the build</tspan><tspan x="833" dy="30">S3 keeps release versions</tspan></text><rect class="card" x="430" y="455" width="340" height="205" fill="#EAF4FF" stroke="#3984B8"/><text class="head" x="448" y="493">7  VISIT</text><text class="body" x="448" y="538"><tspan x="448">Browser opens</tspan><tspan x="448" dy="30">the website URL</tspan><tspan x="448" dy="30">Optional CloudFront</tspan></text><rect class="card" x="45" y="455" width="340" height="205" fill="#F0EDFF" stroke="#8066C2"/><text class="head" x="63" y="493">8  MANAGE</text><text class="body" x="63" y="538"><tspan x="63">CLI shows status</tspan><tspan x="63" dy="30">or rolls back</tspan><tspan x="63" dy="30">Restore previous release</tspan></text><path class="arrow" d="M385 282h38M770 282h38M1155 282h38M1370 385V447M1200 557h-38M815 557h-38M430 557h-38"/><rect class="card" x="45" y="745" width="300" height="40" fill="#f1f5f9" stroke="#94a3b8"/><text class="head" x="63" y="772">WHAT EACH TOOL DOES</text><rect class="card" x="45" y="800" width="1510" height="90" fill="#f8fafc" stroke="#cbd5e1"/><text class="body" x="68" y="835"><tspan x="68">Python CLI: the commands and deployment coordinator • Docker + Node.js: repeatable, isolated React builds</tspan><tspan x="68" dy="30">Terraform: creates AWS resources • boto3: calls AWS APIs and uploads files • S3: hosts the site and keeps versions for rollback</tspan></text><rect class="card" x="45" y="925" width="1510" height="65" fill="#fff7fa" stroke="#bc6482"/><text class="body" x="68" y="954"><tspan x="68">OPTIONAL: GitHub Actions or GitLab CI can deploy after a code push. Keep AWS credentials in CI secrets.</tspan><tspan x="68" dy="24">Standard React sites use S3, not EC2. Monitoring stack excluded.</tspan></text></svg>


