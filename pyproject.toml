[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deploy-tool-capstone"
version = "0.1.0"
description = "A Vercel-like CLI for deploying React websites to AWS S3"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]

[project.scripts]
deploy-tool = "deploy_tool.cli:main"

[tool.setuptools.packages.find]
include = ["deploy_tool*"]
exclude = ["work*", "outputs*", "templates*"]

[tool.setuptools.package-data]
deploy_tool = ["terraform/*.tf"]
